# 用法：cp .env.example .env && 按需修改 && docker compose up -d
services:
  jmdownloader:
    image: ${IMAGE:-ghcr.io/jjrexwang/jmdownloader-docker:latest}
    # 想本地从源码构建：git submodule update --init 后改用 `docker compose up -d --build`
    build: .
    container_name: jmdownloader
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1180}:8080"
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    environment:
      # 留空 = 自动从下载目录已有文件的属主推断运行用户（推荐，docker 自动适应飞牛/NAS）；
      # 显式设置则优先使用。PGID 留空时默认与 PUID 相同。
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      TZ: ${TZ:-Asia/Shanghai}
      RUST_LOG: ${RUST_LOG:-info}
      JM_USERNAME: ${JM_USERNAME:-}
      JM_PASSWORD: ${JM_PASSWORD:-}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
